<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SbayStore - Product Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e1a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-card .label {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
            margin-top: 5px;
            color: #60a5fa;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #1e293b;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .tab-btn:hover {
            background: #2d3748;
            color: #e2e8f0;
        }

        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 15px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #f59e0b;
            color: #0a0e1a;
        }

        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #4b5563;
            color: white;
        }

        .btn-secondary:hover {
            background: #374151;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: all 0.3s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            border-color: #3b82f6;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-card .info {
            padding: 15px;
        }

        .product-card .name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .product-card .category {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .product-card .price {
            color: #60a5fa;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .product-card .stock {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .stock-in {
            background: #064e3b;
            color: #34d399;
        }

        .stock-low {
            background: #78350f;
            color: #fbbf24;
        }

        .stock-out {
            background: #7f1d1d;
            color: #f87171;
        }

        .product-card .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .product-card .actions .btn {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .modal-content .close {
            float: right;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #064e3b;
            color: #34d399;
            border: 1px solid #065f46;
        }

        .alert-error {
            background: #7f1d1d;
            color: #f87171;
            border: 1px solid #991b1b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ SbayStore</h1>
        <p class="subtitle">Product Management System</p>

        <div id="alert" class="alert"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="label">Total Products</div>
                <div class="value" id="totalProducts">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Stock</div>
                <div class="value" id="totalStock">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Low Stock Items</div>
                <div class="value" id="lowStock">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Categories</div>
                <div class="value" id="totalCategories">0</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="products">📦 Products</button>
            <button class="tab-btn" data-tab="add">➕ Add Product</button>
            <button class="tab-btn" data-tab="stock">📊 Manage Stock</button>
        </div>

        <!-- Products Tab -->
        <div id="products" class="tab-content active">
            <div style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search products..." style="flex:1; padding: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0;">
                <button class="btn btn-primary" onclick="loadProducts()">Search</button>
            </div>
            <div id="productList">
                <div class="loading">Loading products...</div>
            </div>
        </div>

        <!-- Add Product Tab -->
        <div id="add" class="tab-content">
            <h2>Add New Product</h2>
            <form id="addProductForm">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="prodName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price *</label>
                        <input type="number" id="prodPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>Stock</label>
                        <input type="number" id="prodStock" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <input type="text" id="prodCategory" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="prodImage" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="prodDescription" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-success">Create Product</button>
            </form>
        </div>

        <!-- Stock Management Tab -->
        <div id="stock" class="tab-content">
            <h2>Manage Stock</h2>
            <div style="margin-bottom: 20px;">
                <select id="stockProductSelect" style="width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0;">
                    <option value="">Select a product...</option>
                </select>
            </div>
            <div id="stockInfo" style="display: none;">
                <div style="background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 id="stockProductName"></h3>
                    <p>Current Stock: <strong id="currentStock">0</strong></p>
                </div>
                <form id="addStockForm">
                    <div class="form-group">
                        <label>Quantity to Add *</label>
                        <input type="number" id="stockQuantity" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Note (optional)</label>
                        <input type="text" id="stockNote" placeholder="Restock, Return, etc.">
                    </div>
                    <button type="submit" class="btn btn-primary">Add Stock</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentPage = 1;
        let productsData = [];

        // Show alert
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Load products
        async function loadProducts(page = 1, search = '') {
            try {
                const url = `${API_BASE}/products?page=${page}&limit=24${search ? '&search=' + search : ''}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    productsData = data.products;
                    renderProducts(data);
                    updateStats(data);
                    updateStockSelect();
                    currentPage = data.page;
                }
            } catch (error) {
                console.error('Error loading products:', error);
                showAlert('Error loading products', 'error');
            }
        }

        // Render products
        function renderProducts(data) {
            const container = document.getElementById('productList');
            
            if (!data.products || data.products.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:40px; color: #94a3b8;">No products found</p>';
                return;
            }

            let html = '<div class="product-grid">';
            data.products.forEach(product => {
                const stockClass = product.product_stock > 10 ? 'stock-in' : 
                                 product.product_stock > 0 ? 'stock-low' : 'stock-out';
                const stockText = product.product_stock > 10 ? 'In Stock' :
                                 product.product_stock > 0 ? 'Low Stock' : 'Out of Stock';

                html += `
                    <div class="product-card">
                        <img src="${product.product_image_url || 'https://via.placeholder.com/300x200/111827/2563EB?text=No+Image'}" 
                             alt="${product.product_name}"
                             onerror="this.src='https://via.placeholder.com/300x200/111827/2563EB?text=No+Image'">
                        <div class="info">
                            <div class="name">${product.product_name}</div>
                            <div class="category">${product.product_category || 'Uncategorized'}</div>
                            <div class="price">$${product.product_price.toFixed(2)}</div>
                            <span class="stock ${stockClass}">${stockText} (${product.product_stock})</span>
                            <div class="actions">
                                <button class="btn btn-warning" onclick="addStockQuick('${product.product_id}')">+ Stock</button>
                                <button class="btn btn-danger" onclick="deleteProduct('${product.product_id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            // Pagination
            if (data.totalPages > 1) {
                html += `<div style="display:flex; gap:10px; justify-content:center; margin-top:20px;">`;
                if (data.hasPrevPage) {
                    html += `<button class="btn btn-secondary" onclick="loadProducts(${data.page - 1})">Previous</button>`;
                }
                html += `<span style="padding:10px; color:#94a3b8;">Page ${data.page} of ${data.totalPages}</span>`;
                if (data.hasNextPage) {
                    html += `<button class="btn btn-secondary" onclick="loadProducts(${data.page + 1})">Next</button>`;
                }
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // Update stats
        function updateStats(data) {
            document.getElementById('totalProducts').textContent = data.total || 0;
            document.getElementById('totalStock').textContent = productsData.reduce((sum, p) => sum + (p.product_stock || 0), 0);
            document.getElementById('lowStock').textContent = productsData.filter(p => p.product_stock <= 10).length;
            document.getElementById('totalCategories').textContent = data.categories ? data.categories.length : 0;
        }

        // Update stock select dropdown
        function updateStockSelect() {
            const select = document.getElementById('stockProductSelect');
            const currentValue = select.value;
            select.innerHTML = '<option value="">Select a product...</option>';
            productsData.forEach(p => {
                select.innerHTML += `<option value="${p.product_id}">${p.product_name} (Stock: ${p.product_stock})</option>`;
            });
            if (currentValue) {
                select.value = currentValue;
            }
        }

        // Add product form
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const product = {
                product_name: document.getElementById('prodName').value,
                product_price: parseFloat(document.getElementById('prodPrice').value),
                product_stock: parseInt(document.getElementById('prodStock').value) || 0,
                product_category: document.getElementById('prodCategory').value,
                product_image_url: document.getElementById('prodImage').value,
                product_description: document.getElementById('prodDescription').value
            };

            try {
                const response = await fetch(`${API_BASE}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('Product created successfully!');
                    loadProducts();
                    document.getElementById('addProductForm').reset();
                } else {
                    showAlert(data.message || 'Error creating product', 'error');
                }
            } catch (error) {
                showAlert('Error creating product', 'error');
                console.error(error);
            }
        });

        // Add stock form
        document.getElementById('addStockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const productId = document.getElementById('stockProductSelect').value;
            if (!productId) {
                showAlert('Please select a product', 'error');
                return;
            }

            const quantity = parseInt(document.getElementById('stockQuantity').value);
            const note = document.getElementById('stockNote').value;

            try {
                const response = await fetch(`${API_BASE}/products/${productId}/add-stock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity, note })
                });

                const data = await response.json();
                if (data.success) {
                    showAlert(`Added ${quantity} units to stock!`);
                    loadProducts();
                    document.getElementById('stockQuantity').value = '';
                    document.getElementById('stockNote').value = '';
                    // Update stock info
                    document.getElementById('currentStock').textContent = data.product.product_stock;
                } else {
                    showAlert(data.message || 'Error adding stock', 'error');
                }
            } catch (error) {
                showAlert('Error adding stock', 'error');
                console.error(error);
            }
        });

        // Quick add stock
        async function addStockQuick(productId) {
            const quantity = prompt('Enter quantity to add:');
            if (!quantity || isNaN(quantity) || parseInt(quantity) <= 0) return;

            try {
                const response = await fetch(`${API_BASE}/products/${productId}/add-stock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: parseInt(quantity), note: 'Quick add' })
                });

                const data = await response.json();
                if (data.success) {
                    showAlert(`Added ${quantity} units to stock!`);
                    loadProducts();
                } else {
                    showAlert(data.message || 'Error adding stock', 'error');
                }
            } catch (error) {
                showAlert('Error adding stock', 'error');
                console.error(error);
            }
        }

        // Delete product
        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const response = await fetch(`${API_BASE}/products/${productId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('Product deleted successfully');
                    loadProducts();
                } else {
                    showAlert(data.message || 'Error deleting product', 'error');
                }
            } catch (error) {
                showAlert('Error deleting product', 'error');
                console.error(error);
            }
        }

        // Stock product select change
        document.getElementById('stockProductSelect').addEventListener('change', function() {
            const stockInfo = document.getElementById('stockInfo');
            if (this.value) {
                const product = productsData.find(p => p.product_id === this.value);
                if (product) {
                    document.getElementById('stockProductName').textContent = product.product_name;
                    document.getElementById('currentStock').textContent = product.product_stock;
                    stockInfo.style.display = 'block';
                }
            } else {
                stockInfo.style.display = 'none';
            }
        });

        // Search
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                loadProducts(1, e.target.value);
            }
        });

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                
                this.classList.add('active');
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });

        // Initial load
        loadProducts();
    </script>
</body>
</html>
